<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin — Road & Traffic Planner</title>
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <link rel="stylesheet" href="/static/css/admin.css"/>
</head>
<body>
<div id="admin-app">

  <div id="logo">
    <div id="logo-wordmark">Admin</div>
    <div id="logo-sub">Road &amp; Traffic Planner</div>
    <div id="logo-nav">
      <a href="/app" class="logo-nav-link">Back to app</a>
      <a href="/logout" class="logo-nav-link">Sign out</a>
      <button id="btn-theme" class="logo-nav-link" type="button" style="background:none;border:none;font-family:inherit;cursor:pointer;padding:0" title="Toggle dark/light mode">&#9680;</button>
    </div>
  </div>

  <div id="admin-content">

    <section class="panel admin-panel">
      <div class="panel-label">Users</div>

      <table class="admin-table">
        <thead><tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead>
        <tbody id="users-body"></tbody>
      </table>
      <div id="user-status" class="status"></div>

      <form id="form-add-user" class="admin-form">
        <div class="field">
          <label for="new-username">Username</label>
          <input type="text" id="new-username" required>
        </div>
        <div class="field">
          <label for="new-password">Password</label>
          <input type="password" id="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="new-role">Role</label>
          <select id="new-role">
            <option value="planner">planner</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Add user</button>
      </form>
    </section>

    <section class="panel admin-panel">
      <div class="panel-label">Traffic model calibration</div>
      <p class="hint">Baseline congestion (0&ndash;1) by hour, per road type. Drives the traffic prediction model used across the app.</p>

      <div class="profile-scroll">
        <table class="admin-table profile-table">
          <thead><tr id="profile-head"></tr></thead>
          <tbody id="profile-body"></tbody>
        </table>
      </div>

      <div class="btn-row">
        <button id="btn-save-profile" class="btn btn-primary">Save changes</button>
        <button id="btn-reset-profile" class="btn btn-ghost">Reset to defaults</button>
      </div>
      <div id="profile-status" class="status"></div>
    </section>

  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
