<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign in — Online Road Network & Traffic Planner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, Arial, sans-serif; color: #222; background: #fafafa;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav { padding: 14px 24px; border-bottom: 1px solid #ddd; background: #fff; }
    nav a { text-decoration: none; font-size: 15px; font-weight: bold; color: #222; }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
    .card {
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 32px; width: 100%; max-width: 360px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #666; margin-bottom: 20px; }

    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; margin-top: 14px; }
    input {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 14px; font-family: inherit;
    }
    input:focus { outline: 1px solid #2451e5; border-color: #2451e5; }

    button {
      width: 100%; margin-top: 18px; padding: 10px; background: #2451e5; color: #fff;
      border: none; border-radius: 4px; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #1b3fbe; }

    .alert {
      background: #fdeded; border: 1px solid #e5b4b4; border-radius: 4px;
      padding: 8px 12px; font-size: 13px; color: #a33; margin-bottom: 10px;
    }

    .demo {
      margin-top: 20px; padding: 10px 12px; background: #f5f5f5; border: 1px solid #e5e5e5;
      border-radius: 4px; font-size: 12.5px; color: #555;
    }
    .demo-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .demo-row + .demo-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e5e5; }
    .demo b { color: #222; }
    .demo button {
      width: auto; flex-shrink: 0; margin: 0; padding: 4px 10px; font-size: 11.5px;
      background: #fff; color: #2451e5; border: 1px solid #2451e5;
    }
    .demo button:hover { background: #eef1fd; }

    .back { text-align: center; margin-top: 16px; font-size: 12.5px; }
    .back a { color: #555; }
  </style>
</head>
<body>

  <nav><a href="/">Online Road Network &amp; Traffic Planner</a></nav>

  <main>
    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Nairobi Road Planner</p>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required/>

        <button type="submit">Sign in</button>
      </form>

      <div class="demo">
        <div class="demo-row">
          <span>Admin — <b>demo</b> / <b>urbanflow</b></span>
          <button type="button" id="fill-admin">Fill in</button>
        </div>
        <div class="demo-row">
          <span>Planner — <b>planner</b> / <b>planner123</b></span>
          <button type="button" id="fill-planner">Fill in</button>
        </div>
      </div>

      <div class="back"><a href="/">&larr; Back to home</a></div>
    </div>
  </main>

  <script>
    document.getElementById('fill-admin').addEventListener('click', () => {
      document.getElementById('username').value = 'demo';
      document.getElementById('password').value = 'urbanflow';
    });
    document.getElementById('fill-planner').addEventListener('click', () => {
      document.getElementById('username').value = 'planner';
      document.getElementById('password').value = 'planner123';
    });
  </script>

</body>
</html>
